<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Set up Splyntara</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy">
          <span class="brand-name">Splyntara</span>
          <span class="brand-caption">Local account setup</span>
        </span>
      </div>
      <span class="header-meta">Local workbench</span>
    </div>
  </header>
  <main class="page auth-page">
    <section class="panel auth-card" aria-labelledby="setup-title">
      <p class="section-kicker">First run</p>
      <h1 id="setup-title">Create your local account</h1>
      <p class="panel-note">
        This single account protects the local dashboard. Choose a username and
        a password with at least 12 characters.
      </p>
      {% if error %}
      <p class="auth-error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('setup') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="64"
               autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="12"
               autocomplete="new-password" required>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm_password" type="password"
               minlength="12" autocomplete="new-password" required>
        <button class="button button-primary" type="submit">Create account</button>
      </form>
    </section>
  </main>
</body>
</html>
